name: Build and Push Microservices

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- 1. SETUP & LOGIN ---
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # --- 2. BUILD JAVA BACKEND ---
      - name: Build Java Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .              # Java files are in the root
          file: ./Dockerfile      # Explicitly point to the Java Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/meal-bridge:latest

      # --- 3. BUILD PYTHON ML SERVICE ---
      - name: Build Python ML Image
        uses: docker/build-push-action@v5
        with:
          context: ./ML_Model   # Python files are in this folder
          file: ./ML_Model/Dockerfile
          push: true
          # Note the different image name (-ml)
          tags: ${{ secrets.DOCKER_USERNAME }}/meal-bridge-ml:latest