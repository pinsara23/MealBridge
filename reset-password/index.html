<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MealBridge - Reset Password</title>
    <meta name="description" content="Reset your password for MealBridge application.">

    <!-- Google Fonts for premium typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="background-overlay"></div>

    <main class="container">
        <div class="card reset-card">
            <header class="card-header">
                <div class="logo-container">
                    <!-- Simple SVG Logo Placeholder -->
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" class="logo-icon">
                        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
                    </svg>
                </div>
                <h1>Reset Your Password</h1>
                <p class="subtitle">Enter your new password below.</p>
            </header>

            <form id="reset-password-form" class="form-group">
                <div class="input-wrapper">
                    <label for="new-password">New Password</label>
                    <input type="password" id="new-password" name="new-password" required
                        placeholder="Enter new password" minlength="8">
                </div>

                <div class="input-wrapper">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" name="confirm-password" required
                        placeholder="Confirm new password" minlength="8">
                    <div id="password-match-error" class="error-message hidden">Passwords do not match</div>
                </div>

                <button type="submit" id="submit-btn" class="btn-primary">
                    <span class="btn-text">Reset Password</span>
                    <span class="loader hidden"></span>
                </button>

                <div id="form-message" class="message hidden"></div>
            </form>

            <footer class="card-footer">
                <p>&copy; 2026 MealBridge. All rights reserved.</p>
                .
            </footer>
        </div>
    </main>

    <script src="script.js"></script>
</body>

</html>
